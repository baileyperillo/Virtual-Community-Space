<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Details</title>

    <link rel="stylesheet" href="/style.css">

    <script src="/scripts/header.js" defer></script>
    <script src="/scripts/gym.js" defer></script>
</head>

<body>

    <header></header>

    <main id="gym-content" class="gym-info">

        <div class="image-container">
            <img id="image" src="" alt="Gym">
        </div>

        <div class="gym-details">

            <h2 id="name"></h2>
            <p id="pricePoint"></p>
            <p id="location"></p>
            <p id="classes"></p>
            <p id="description"></p>

        </div>
        
        <section class="events-section">
            <h2>Events at this Gym</h2>

            <div id="events-container"></div>
        </section>

    </main>

</body>

</html>
